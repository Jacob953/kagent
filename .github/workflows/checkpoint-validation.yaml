---
name: Checkpoint independent validation
'on':
  push:
    branches:
    - validate/checkpoint-238ef3d2
permissions:
  contents: read
  actions: write
concurrency:
  group: checkpoint-validation-${{ github.ref }}
  cancel-in-progress: true
env:
  CACHE_KEY_PREFIX: kagent-v2
  BRANCH_CACHE_KEY: "${{ github.head_ref || (github.event.merge_group.base_ref &&
    'merge-queue') || github.ref_name }}"
  BUILDX_BUILDER_NAME: kagent-builder-v0.23.0
  BUILDX_VERSION: v0.23.0
  KIND_IMAGE_VERSION: 1.37.0
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        sandbox_class:
        - gvisor
        - microvm
    env:
      VERSION: v0.0.1-test
      KIND_SANDBOX_CLASS: "${{ matrix.sandbox_class }}"
      E2E_PARALLEL: '2'
      KIND_IMAGE_VERSION: 1.37.0
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Check out validation subject
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Verify production sources match PR head
      run: 'git diff --exit-code 69d32f3acfbb7e4c5fafa30a3734ea80c54f0c24 HEAD --
        . '':!.github/workflows/checkpoint-validation.yaml''

'
    - name: Verify nested KVM before MicroVM setup
      if: matrix.sandbox_class == 'microvm'
      shell: bash
      run: |
        set -euo pipefail
        uname -m
        sudo modprobe kvm_intel || sudo modprobe kvm_amd || true
        sudo python3 - <<'PY'
        import fcntl, os
        with open('/dev/kvm', 'r+b', buffering=0) as kvm:
            assert fcntl.ioctl(kvm, 0xAE00, 0) == 12
            vm = fcntl.ioctl(kvm, 0xAE01, 0)
            os.close(vm)
        print('KVM_CREATE_VM succeeded')
        PY
    - name: Initialize Environment
      uses: "./.github/actions/initialize-environment"
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go/go.mod
        cache: false
    - name: Cache E2E Go dependencies and build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: e2e-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go/go.mod',
          'go/go.sum') }}
        restore-keys: 'e2e-go-${{ runner.os }}-${{ runner.arch }}-

'
    - name: Resolve Substrate release
      working-directory: go
      run: |
        version=$(go list -m -f '{{.Replace.Version}}' go.ate.dev/substrate)
        echo "SUBSTRATE_VERSION=${version#v}" >> "$GITHUB_ENV"
    - name: Allow unprivileged user namespaces
      run: 'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

'
    - name: Set up standard Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        name: kagent-builder-v0.23.0
        version: v0.23.0
        platforms: linux/amd64
        use: 'true'
        driver-opts: network=host
    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
      with:
        version: v3.18.0
    - name: Install Kind
      id: kind
      uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa
      with:
        version: v0.33.0
        install_only: true
    - name: Create Kind cluster
      run: make create-kind-cluster
    - name: Install Kagent
      id: install-kagent
      env:
        OPENAI_API_KEY: fake
      run: |
        # Reuse Blacksmith's persistent layers and Go cache mounts. The Makefile
        # otherwise selects a fresh local builder, discarding that cache.
        BUILDX_BUILDER_NAME=$(docker buildx inspect | awk '$1 == "Name:" { print $2; exit }')
        test -n "$BUILDX_BUILDER_NAME"
        export BUILDX_BUILDER_NAME
        make buildx-create
        mkdir -p "$RUNNER_TEMP/runtime-images"
        printf '%s\n' controller golang-adk claude-harness codex-harness byo-a2a sandbox-guest | xargs -P2 -n1 bash -c '
          image="$1"
          RUNTIME_IMAGE_METADATA_DIR="$RUNNER_TEMP/runtime-images" \
          DOCKER_BUILD_ARGS="--platform=linux/amd64 --push" \
            make GIT_COMMIT=e2e BUILD_DATE=1970-01-01 "build-${image}"
        ' _
        # Resolve the guest on the runner: localhost:5001 is not reachable
        # from the controller pod. Substrate rewrites registry pulls on workers.
        GUEST_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/sandbox-guest:${VERSION}" | awk '$1 == "Digest:" { print $2 }')
        test -n "$GUEST_DIGEST"
        make build-cli-local helm-release RUNTIME_IMAGE_METADATA_DIR="$RUNNER_TEMP/runtime-images" RUNTIME_IMAGE_REPOSITORY=localhost:5001/kagent-dev/kagent
        mkdir -p "$RUNNER_TEMP/release-charts"
        tar -xzf "dist/kagent-${VERSION}.tgz" -C "$RUNNER_TEMP/release-charts"
        tar -xzf "dist/kagent-crds-${VERSION}.tgz" -C "$RUNNER_TEMP/release-charts"
        cat > "$RUNNER_TEMP/kagent-values.yaml" <<EOF
        registry: localhost:5001
        tag: "${VERSION}"
        imagePullPolicy: Always
        controller:
          image:
            pullPolicy: Always
          service:
            type: LoadBalancer
          # Check startup promptly across restart tests, keeping a 60s budget.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 1
        config:
          push:
            allowHttp: true
            allowPrivateNetworks: true
          sandboxes:
            guestImage: "localhost:5001/kagent-dev/kagent/sandbox-guest@${GUEST_DIGEST}"
          telemetry:
            traces:
              endpoint: http://e2e-otlp.kagent.svc.cluster.local:14317
            metrics:
              endpoint: http://e2e-otlp.kagent.svc.cluster.local:14317
          runtimeDefaults:
            tokenPropagation:
              enabled: true
            telemetry:
              traces:
                endpoint: http://e2e-otlp.kagent.svc.cluster.local:14317
              metrics:
                endpoint: http://e2e-otlp.kagent.svc.cluster.local:14317
        ui:
          replicas: 0
        kagent-tools:
          enabled: false
        substrateWorkerPool:
          create: true
          replicas: 4
          sandboxClass: ${{ matrix.sandbox_class }}
          workerImage: ghcr.io/kagent-dev/substrate/ateworker-${{ matrix.sandbox_class }}:v${{ env.SUBSTRATE_VERSION }}
        EOF
        cat > "$RUNNER_TEMP/substrate-values.yaml" <<EOF
        # CI-only grants for cross-namespace model and MCP credential tests.
        # Keep kagent-untrusted excluded to verify credential-provider denial.
        credentialProvider:
          namespacePolicies:
            - atespace: kagent
              allowedNamespaces: [kagent, kagent-shared-models, kagent-shared-tools]
        ateApi:
          extraArgs: [--template-resync-interval=250ms]
        EOF
        cat > "$RUNNER_TEMP/atelet-values.yaml" <<EOF
        atelet:
          resources:
            limits:
              memory: 2Gi
          extraArgs: [--localhost-registry-replacement=kind-registry:5000]
        EOF
        cat > "$RUNNER_TEMP/kagent-cli.yaml" <<EOF
        install:
          kagent:
            repository: "${RUNNER_TEMP}/release-charts/"
            version: "${VERSION}"
            valuesFiles: ["${RUNNER_TEMP}/kagent-values.yaml"]
          atelet:
            valuesFiles: ["${RUNNER_TEMP}/atelet-values.yaml"]
          substrate:
            valuesFiles:
              - "${RUNNER_TEMP}/substrate-values.yaml"
              - "${GITHUB_WORKSPACE}/go/core/test/e2e/manifests/substrate-values.yaml"
        EOF
        ./go/core/bin/kagent-local --config "$RUNNER_TEMP/kagent-cli.yaml" install --namespace kagent
        kubectl rollout status deployment/kagent-controller -n kagent --timeout=120s
        kubectl wait --for=condition=Ready pod -l app.kubernetes.io/component=controller -n kagent --timeout=120s
    - name: Verify Substrate CLI access after install
      working-directory: go
      run: |
        SUBSTRATE_CLI_SOURCE=$(go mod download -json go.ate.dev/substrate | jq -r .Dir)
        go -C "$SUBSTRATE_CLI_SOURCE" run -mod=readonly ./cmd/kubectl-ate get actors --all-atespaces
    - name: Cache Cloud Hypervisor assets
      if: matrix.sandbox_class == 'microvm'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ".cache/substrate/microvm-assets"
        key: microvm-assets-v2-amd64-${{ env.SUBSTRATE_VERSION }}
    - name: Install Cloud Hypervisor runtime
      if: matrix.sandbox_class == 'microvm'
      run: bash scripts/kind/setup-microvm.sh
    - name: Run e2e tests
      if: success()
      working-directory: go
      shell: bash
      run: |
        # Read all output so Docker does not get a broken pipe under pipefail.
        RUNTIME_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/golang-adk:${VERSION}" | awk '$1 == "Digest:" { print $2 }')
        test -n "$RUNTIME_DIGEST"
        export KAGENT_E2E_RUNTIME_IMAGE="localhost:5001/kagent-dev/kagent/golang-adk@${RUNTIME_DIGEST}"
        BYO_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/byo-a2a:${VERSION}" | awk '$1 == "Digest:" { print $2 }')
        test -n "$BYO_DIGEST"
        export KAGENT_E2E_BYO_IMAGE="localhost:5001/kagent-dev/kagent/byo-a2a@${BYO_DIGEST}"
        CLAUDE_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/claude-harness:${VERSION}" | awk '$1 == "Digest:" { print $2 }')
        test -n "$CLAUDE_DIGEST"
        export KAGENT_E2E_CLAUDE_IMAGE="localhost:5001/kagent-dev/kagent/claude-harness@${CLAUDE_DIGEST}"
        CODEX_DIGEST=$(docker buildx imagetools inspect "localhost:5001/kagent-dev/kagent/codex-harness:${VERSION}" | awk '$1 == "Digest:" { print $2 }')
        test -n "$CODEX_DIGEST"
        export KAGENT_E2E_CODEX_IMAGE="localhost:5001/kagent-dev/kagent/codex-harness@${CODEX_DIGEST}"
        # Capture smoke startup failures before concurrent actors displace them.
        mkdir -p "$RUNNER_TEMP/e2e-logs"
        kubectl logs -n kagent -l ate.dev/worker-pool --all-containers --prefix --timestamps --tail=-1 --follow --max-log-requests=20 > "$RUNNER_TEMP/e2e-logs/workers.log" 2>&1 &
        worker_logs_pid=$!
        kubectl logs -n ate-system -l app --all-containers --prefix --timestamps --tail=-1 --follow --max-log-requests=20 > "$RUNNER_TEMP/e2e-logs/substrate.log" 2>&1 &
        substrate_logs_pid=$!
        trap 'kill "$worker_logs_pid" "$substrate_logs_pid" 2>/dev/null || true; wait "$worker_logs_pid" "$substrate_logs_pid" 2>/dev/null || true' EXIT
        envsubst < core/test/e2e/manifests/lifecycle.yaml.tmpl | kubectl apply -f -
        for _ in $(seq 1 60); do
          READY=$(kubectl get agent smoke -n kagent -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
          if [ "$READY" = True ]; then break; fi
          sleep 5
        done
        test "$READY" = True
        export KAGENT_E2E_API_URL="http://$(kubectl get svc -n kagent kagent-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}'):8083"
        echo "KAGENT_E2E_API_URL: $KAGENT_E2E_API_URL"
        make core/bin/kagent-local
        export KAGENT_E2E_CLI="$PWD/core/bin/kagent-local"
        export KAGENT_E2E_LOCAL_HOST=172.17.0.1
        envsubst < core/test/e2e/manifests/tracing.yaml.tmpl | kubectl apply -f -
        # TestMain keeps the receiver alive for every runtime's response flush.
        export KAGENT_E2E_OTLP_LISTEN_ADDRESS=:14317
        # TestMain replays what the receiver got to Weaver live-check.
        ../telemetry/live-check.sh start
        export KAGENT_E2E_LIVE_CHECK_ENDPOINT=127.0.0.1:4319
        go test -v github.com/kagent-dev/kagent/go/core/test/e2e -shuffle=on -parallel "$E2E_PARALLEL" -count=1 -timeout=30m 2>&1 | tee "$RUNNER_TEMP/e2e-logs/tests.log"
    - name: Check E2E telemetry with Weaver live-check
      if: always()
      run: |
        mkdir -p "$RUNNER_TEMP/e2e-logs"
        telemetry/live-check.sh stop || echo "::warning::Weaver live-check produced no report"
        cp -r telemetry/conformance/report "$RUNNER_TEMP/e2e-logs/live-check" 2>/dev/null || true
    - name: Collect E2E controller logs
      if: always()
      run: |
        mkdir -p "$RUNNER_TEMP/e2e-logs"
        kubectl logs -n kagent deployment/kagent-controller --timestamps > "$RUNNER_TEMP/e2e-logs/controller.log" 2>&1 || true
    - name: Upload E2E logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: e2e-logs-${{ matrix.sandbox_class }}
        path: "${{ runner.temp }}/e2e-logs"
        retention-days: 7
    - name: fail print info
      if: failure()
      run: |
        echo "::error::Failed to run e2e tests"
        echo "::error::Kubectl get pods -n kagent"
        kubectl describe pods -n kagent
        echo "::error::Kubectl get events -n kagent"
        kubectl get events -n kagent
        echo "::error::Kubectl get Harnesses and AgentTemplates -n kagent"
        kubectl get harnesses,agenttemplates -n kagent
        echo "::error::Kubectl logs -n kagent deployment/kagent-controller"
        kubectl logs -n kagent deployment/kagent-controller || true
        kubectl get pods,workerpools -A
        echo "::error::Substrate logs"
        kubectl describe pods -n ate-system || true
        kubectl logs -n ate-system -l app --all-containers --prefix --tail=200 || true
        kubectl logs -n ate-system -l app --all-containers --prefix --previous --tail=200 || true
        kubectl logs -n kagent -l ate.dev/worker-pool --all-containers --prefix --tail=200 || true
        kubectl logs -n kagent -l ate.dev/worker-pool --all-containers --prefix --previous --tail=200 || true
    name: Full API E2E (${{ matrix.sandbox_class }})
  upgrade-tests:
    env:
      VERSION: v0.0.1-test
      KIND_IMAGE_VERSION: 1.37.0
      REMOTE: https://github.com/kagent-dev/kagent.git
      E2E_PARALLEL: '2'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        upgrade-from:
        - prev-stable
    steps:
    - name: Check out validation subject
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Verify production sources match PR head
      run: 'git diff --exit-code 69d32f3acfbb7e4c5fafa30a3734ea80c54f0c24 HEAD --
        . '':!.github/workflows/checkpoint-validation.yaml''

'
    - name: Fetch authoritative release tags
      run: 'git fetch --tags https://github.com/kagent-dev/kagent.git

'
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go/go.mod
        cache: false
    - name: Prepare upgrade test environment
      id: prep
      uses: "./.github/actions/upgrade-test-setup"
      with:
        upgrade-from: "${{ matrix.upgrade-from }}"
    - name: Require the published v1.0.0 baseline to execute
      env:
        BASELINE: "${{ steps.prep.outputs.version }}"
        SKIP: "${{ steps.prep.outputs.skip }}"
      run: |
        test "$SKIP" != true
        test "$BASELINE" = 1.0.0
    - name: Run upgrade tests
      if: steps.prep.outputs.skip != 'true'
      env:
        OPENAI_API_KEY: fake
        BUILDX_BUILDER_NAME: "${{ env.BUILDX_BUILDER_NAME }}"
        DOCKER_BUILD_ARGS: "--platform=linux/amd64 --push"
      run: 'make run-upgrade-tests UPGRADE_FROM_VERSION="${{ steps.prep.outputs.version
        }}"

'
    - name: fail print info
      if: failure() && steps.prep.outputs.skip != 'true'
      run: |
        echo "::error::Failed to run upgrade tests"
        kubectl describe pods -n kagent
        kubectl get events -n kagent
        kubectl logs -n kagent deployment/kagent-controller || true
    name: Published-release upgrade and rollback
    timeout-minutes: 100
  rolling-upgrade-tests:
    env:
      VERSION: v0.0.1-test
      KIND_IMAGE_VERSION: 1.37.0
      REMOTE: https://github.com/kagent-dev/kagent.git
      E2E_PARALLEL: '2'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        upgrade-from:
        - prev-stable
    steps:
    - name: Check out validation subject
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Verify production sources match PR head
      run: 'git diff --exit-code 69d32f3acfbb7e4c5fafa30a3734ea80c54f0c24 HEAD --
        . '':!.github/workflows/checkpoint-validation.yaml''

'
    - name: Fetch authoritative release tags
      run: 'git fetch --tags https://github.com/kagent-dev/kagent.git

'
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go/go.mod
        cache: false
    - name: Prepare upgrade test environment
      id: prep
      uses: "./.github/actions/upgrade-test-setup"
      with:
        upgrade-from: "${{ matrix.upgrade-from }}"
    - name: Require the published v1.0.0 baseline to execute
      env:
        BASELINE: "${{ steps.prep.outputs.version }}"
        SKIP: "${{ steps.prep.outputs.skip }}"
      run: |
        test "$SKIP" != true
        test "$BASELINE" = 1.0.0
    - name: Run rolling upgrade tests
      if: steps.prep.outputs.skip != 'true'
      env:
        OPENAI_API_KEY: fake
        BUILDX_BUILDER_NAME: "${{ env.BUILDX_BUILDER_NAME }}"
        DOCKER_BUILD_ARGS: "--platform=linux/amd64 --push"
      run: 'make run-rolling-upgrade-tests UPGRADE_FROM_VERSION="${{ steps.prep.outputs.version
        }}"

'
    - name: fail print info
      if: failure() && steps.prep.outputs.skip != 'true'
      run: |
        echo "::error::Failed to run rolling upgrade tests"
        kubectl describe pods -n kagent
        kubectl get events -n kagent
        kubectl logs -n kagent deployment/kagent-controller || true
    name: Published-release rolling upgrade
    timeout-minutes: 100
  checkpoint-postgres:
    name: PostgreSQL expiry and ownership regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Check out validation subject
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Verify production sources match PR head
      run: 'git diff --exit-code 69d32f3acfbb7e4c5fafa30a3734ea80c54f0c24 HEAD --
        . '':!.github/workflows/checkpoint-validation.yaml''

'
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go/go.mod
        cache: false
    - name: Cache E2E Go dependencies and build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: e2e-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go/go.mod',
          'go/go.sum') }}
        restore-keys: 'e2e-go-${{ runner.os }}-${{ runner.arch }}-

'
    - name: Exercise expiry after lock waits and existing claim fences
      working-directory: go
      run: 'go test -race -count=3 -shuffle=on -run ''^Test(CheckpointCompletionRejectsExpiryDuringLockWait|CheckpointClaimsFenceCompletionAndDeletion|FailedCheckpointCollectionPreservesRequestAndFencesCleanup|CanceledCheckpointClaimCannotCommitAfterRelease|CheckpointReleaseWaitsForClaimCommit|InlineSQLPrepares)$''
        ./core/internal/database

'
